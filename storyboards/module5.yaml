  type: title_card
  title: Acuerdos bilaterales EE. UU.-China y ámbito militar
  subtitle: Módulo 5
  lead_in: 1.2
  text: 'Llegamos al bloque estratégico: relaciones bilaterales entre ambas potencias, uso militar y prevención
    de crisis.'
- id: m5-02
  type: image
  prompt: Two small delegations seated across a table in a bright meeting room, documents between them.
  text: Respecto a la regulación de la IA no militar, la pregunta es cuándo EE. UU. y China serán parte
    de un acuerdo vinculante con verificación para supervisar el desarrollo civil.
