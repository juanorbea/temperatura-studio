  text: 'Las capacidades de la IA están en marcha para convertirse en los motores del crecimiento económico, la
    capacidad estratégica y el progreso científico. La IA actúa como un multiplicador de fuerza de la capacidad
    existente: acelera la investigación, multiplica las ganancias de productividad y democratiza conocimientos y
    análisis que antes eran escasos.'
