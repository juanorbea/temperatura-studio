# Synthesis-only text changes for Juan's cloned voice. The script and storyboards are not changed.
# Juan's rule: no English pronunciation. English becomes natural Spanish (translate);
# names that cannot be translated get a Spanish spelling of how to say them (respell).
# Whole-word, case-sensitive, longest term first. Numbers are written out afterwards
# (2030s -> "años dos mil treinta", 2025-2060 -> "dos mil veinticinco a dos mil sesenta", 79% -> "setenta y nueve por ciento").

translate:   # Whisper is expected to hear these Spanish words
  "Global AI Governance and Strategic Cooperation Forecasts 2025-2060": "Pronósticos sobre la gobernanza global de la IA y la cooperación estratégica, de 2025 a 2060"
  "Global AI Governance and Strategic Outcomes Forecasts 2025-2060": "Pronósticos sobre la gobernanza global de la IA y sus resultados estratégicos, de 2025 a 2060"
  "Chips for Peace": "Chips para la Paz"
  "cómputo (compute)": "cómputo"
  "compute": "cómputo"
  "red-teaming": "pruebas de equipo rojo"
  "superforecasters": "superpronosticadores"
  "super forecasters": "superpronosticadores"
  "AGI": "IA general"
  "AI": "IA"
  "frontier": "de frontera"
  "Beijing": "Pekín"
  "Good Judgment Inc.": "Good Judgment"   # "Inc." is not said
  "EE. UU.": "Estados Unidos"
  "EE. UU.-China": "Estados Unidos y China"
  "UE": "Unión Europea"
  # japon-chips (video 2)
  "coater/developer": "recubridoras y reveladoras"
  "Chip War": "La guerra de los chips"      # title of the Spanish edition
  "hot lots": "lotes prioritarios"
  "gate-all-around": "de puerta envolvente"
  "commodity": "producto genérico"

respell:     # how to write it so the voice says it right (every engine)
  # Kept for OmniVoice too: English names and acronyms, so they are said the Spanish way
  # (Juan's rule), and spellings that tested as good or better with OmniVoice.
  "Good Judgment": "Gud Yóchment"
  "OPCW": "o pe ce uve doble"
  "INAISI": "Ináisi"
  "CERN": "Cern"
  "EuroHPC": "Euro hache pe ce"
  "Nvidia": "Envidia"
  "Stargate": "Stárgueit"
  "Microsoft": "Máicrosoft"
  "Washington": "Guáshinton"
  # japon-chips (video 2). Acronyms: Spanish letter names; A/B with the Whisper check showed
  # that raw EUV is heard as "EV", DRAM as "drum" and SK Hynix as "Skynix".
  "TSMC": "te ese eme ce"
  "EUV": "e u uve"
  "ASML": "a ese eme ele"
  "IBM": "i be eme"
  "DRAM": "de ram"
  "METI": "Méti"
  "ABF": "a be efe"
  "JSR": "jota ese erre"
  "PIB": "pe i be"
  "I+D": "i más de"
  "3D": "tres de"
  "CoWoS": "Cóuos"          # raw is heard as "Cowash"
  "SK Hynix": "ese ka Jáinix"
  "Tokyo Electron": "Tokio Eléctron"
  "Silicon Valley": "Sílicon Váli"
  "Soul Lot": "Sóul Lot"
  "Titans": "Táitans"
  "Tenstorrent": "Ténstorrent"
  "Synopsys": "Sínopsis"
  "Cadence": "Quéidens"
  "GlobalFoundries": "Glóbal Fáundris"
  "Lam Research": "Lam Ríserch"
  "Applied Materials": "Apláid Matírials"
  "imec": "ímec"
  "Screen": "Scrín"
  "Reagan": "Réigan"
  "Chris Miller": "Cris Míler"
  "Albany": "Álbani"

engine_respell:   # only for one engine; wins over respell
  f5-tts:
    # OmniVoice says these right as written: in an A/B on the script's sentences
    # (Whisper check, 2 seeds each) these spellings did not help it, and "í a" made
    # Whisper hear "ya" or "guía" instead of "IA".
    "IA": "í a"          # stress on the i, two syllables, like Juan says it
    "OIEA": "o i e a"
    "ONU": "Onu"
    "diez hitos": "diez, hitos"   # otherwise heard as "diécitos"
