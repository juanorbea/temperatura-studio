respell:     # how to write it so the voice says it right (every engine)
  # Kept for OmniVoice too: English names and acronyms, so they are said the Spanish way
  # (Juan's rule), and spellings that tested as good or better with OmniVoice.
  # china-ia-01 (serie China y la IA, episodio 1). Catalogue codes are said digit by digit
  # and the last letter by its name (otherwise "doscientos sesenta y seis mil..."); single
  # J and X are the two levels of the catalogue. The voice engines do not read Chinese
  # characters, so they get the pinyin spelled the Spanish way. Spellings from the direction plan.
  "266402J": "Dos, seis, seis, cuatro, cero, dos, jota"
  "266404X": "Dos, seis, seis, cuatro, cero, cuatro, equis"
