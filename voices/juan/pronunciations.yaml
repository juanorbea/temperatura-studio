# Synthesis-only text changes for Juan's cloned voice. The script and storyboards are not changed.
# Juan's rule: no English pronunciation. English becomes natural Spanish (translate);
# names that cannot be translated get a Spanish spelling of how to say them (respell).
# Whole-word, case-sensitive, longest term first. Numbers are written out afterwards
# (2030s -> "años dos mil treinta", 2025-2060 -> "dos mil veinticinco a dos mil sesenta", 79% -> "setenta y nueve por ciento").

